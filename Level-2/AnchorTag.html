<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag</title>
</head>
<body>
    <h3>Anchor Tag</h3>
    <ol>
        <li>Used for creating hyperlink.</li>
        <li>Requires href attributes for URL.</li>
        <li>Can link to external sites or internal pages.</li>
        <li>Support target attributes to control link behavior.</li>
    </ol>
    <p>Syntax;</p>
    <p>&lt;a href ="Link" &gt; Name &lt;/a&gt;</p>
    <p>target= "_blank" It open on new Tab</p>
    <a href="https://www.google.com" target="_blank">Google</a>
</body>
</html>
